name: Preview release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-preview:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: talaqi_preview_test
          POSTGRES_USER: talaqi_preview
          POSTGRES_PASSWORD: preview-only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U talaqi_preview -d talaqi_preview_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://talaqi_preview:preview-only@127.0.0.1:55432/talaqi_preview_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.28
      - run: python -m uv sync --frozen
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: python -m uv run alembic upgrade head
      - run: python -m uv run pytest -q apps/api/tests/db/test_readiness.py tests/deployment
      - run: corepack pnpm build
      - run: corepack pnpm openapi:check
