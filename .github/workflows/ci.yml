name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      api: ${{ steps.classify.outputs.api }}
      contract: ${{ steps.classify.outputs.contract }}
      migration: ${{ steps.classify.outputs.migration }}
      security: ${{ steps.classify.outputs.security }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci/classify_changes.py "$BASE_SHA" "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm brand:check

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-python313-uv-${{ hashFiles('uv.lock') }}
      - run: python -m pip install uv==0.11.28
      - run: python -m uv sync --frozen
      - run: python -m uv run ruff format --check .
      - run: python -m uv run ruff check .
      - run: python -m uv run pyright
      - run: >-
          python -m uv run pytest -q apps/api/tests apps/worker/tests
          --ignore=apps/api/tests/db/test_migrations.py
          --ignore=apps/api/tests/db/test_readiness.py
          --ignore=apps/api/tests/db/test_schema_contract.py
          --ignore=apps/api/tests/platform/test_idempotency_postgres.py

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.28
      - run: python -m uv sync --frozen
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm openapi:check
      - run: corepack pnpm --filter @talaqi/api-client typecheck
      - run: corepack pnpm --filter @talaqi/api-client test

  migration:
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: talaqi_ci_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talaqi_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:55432/talaqi_ci_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.28
      - run: python -m uv sync --frozen
      - run: python -m uv run alembic upgrade head
      - run: python -m uv run alembic downgrade base
      - run: python -m uv run alembic upgrade head
      - run: python -m uv run pytest -q apps/api/tests/db apps/api/tests/platform/test_idempotency_postgres.py

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
      - run: python -m pip install uv==0.11.28
      - run: python -m uv sync --frozen
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm audit --prod --audit-level high
      - run: python -m uv export --frozen --no-dev --no-emit-workspace --no-hashes --output-file /tmp/requirements.txt
      - run: python -m uv run pip-audit --requirement /tmp/requirements.txt
      - run: python -m uv run pre-commit run --all-files
      - run: python -m uv run pre-commit run detect-secrets --all-files
      - run: python -m uv run ruff check --select S apps/api/src apps/worker/src scripts

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @talaqi/web build
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm e2e
