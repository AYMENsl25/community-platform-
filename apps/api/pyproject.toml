[project]
name = "talaqi-api"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "email-validator==2.3.0",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talaqi"]
